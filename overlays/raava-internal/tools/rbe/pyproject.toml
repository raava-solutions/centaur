[project]
name = "rbe"
description = "Raava Brain Engine (RBE) — query, search, pages, facts, backlinks, and timelines from the company knowledge base"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
rbe = "centaur_tool_rbe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_rbe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
hosts = ["brain.raava.dev"]
secrets = [
    {type = "http", name = "RBE_API_TOKEN", match_headers = ["Authorization"], hosts = ["brain.raava.dev"]},
]
