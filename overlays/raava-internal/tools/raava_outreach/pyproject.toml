[project]
name = "raava-outreach"
description = "Raava outreach loop discovery surface over the worker HTTP bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "RAAVA_OUTREACH_HTTP_TOKEN", match_headers = ["Authorization"], hosts = ["host.docker.internal"]},
]
