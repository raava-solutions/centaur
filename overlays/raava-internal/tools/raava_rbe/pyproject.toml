[project]
name = "raava-rbe"
description = "Raava Cloudflare RBE grounding for roster, roles, and decisions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.0"]

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "RAAVA_RBE_API_KEY", match_headers = ["Authorization"], hosts = ["brain.raava.dev"]},
]
