[project]
name = "raava-supermemory"
description = "Supermemory working-memory tool — remember and recall for the outreach operator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "SUPERMEMORY_API_KEY", match_headers = ["Authorization"], hosts = ["api.supermemory.ai"]},
]
