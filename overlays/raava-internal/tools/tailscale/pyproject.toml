[project]
name = "tailscale"
description = "Tailscale — devices, ACL policy file, DNS nameservers, and audit logs (read-only)"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
tailscale = "centaur_tool_tailscale.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_tailscale"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
hosts = ["api.tailscale.com"]
# NOTE: no http-type secrets here — the OAuth client secrets travel in the
# token-request body, not in a header. The CENTAUR_TAILSCALE_* env keys (see
# .env.example) must be present as real environment variables.
