[project]
name = "github"
description = "GitHub App (centaur-ops) — repos, files, branches, PRs, workflow runs; writes via branch+PR only"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "PyJWT[crypto]>=2.8",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
github = "centaur_tool_github.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_github"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
hosts = ["api.github.com"]
# NOTE: no http-type secrets here — the App PEM/ID are used to mint JWTs and
# installation tokens locally, not sent as static headers. The CENTAUR_GITHUB_*
# env keys (see .env.example) must be present as real environment variables.
