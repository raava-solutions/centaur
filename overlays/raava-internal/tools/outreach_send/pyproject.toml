[project]
name = "outreach_send"
version = "0.1.0"
description = "GTM operator email transport — the system's sole email sender via AgentMail."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.centaur]
module = "client.py"

[[tool.centaur.secrets]]
type = "http"
name = "AGENTMAIL_API_KEY"
match_headers = ["Authorization"]
hosts = ["api.agentmail.to"]
