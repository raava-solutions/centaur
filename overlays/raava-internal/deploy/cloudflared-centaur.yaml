apiVersion: v1
kind: ConfigMap
metadata:
  name: centaur-cloudflared-config
  namespace: centaur
data:
  config.yml: |
    tunnel: de4cf7c8-e63d-4e99-98ee-bb001bd24695
    credentials-file: /etc/cloudflared/credentials.json
    ingress:
      - hostname: centaur.raava.dev
        service: http://centaur-centaur-slackbotv2:3001
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaur-cloudflared
  namespace: centaur
  labels:
    app.kubernetes.io/name: centaur-cloudflared
    app.kubernetes.io/part-of: raava-centaur
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: centaur-cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaur-cloudflared
        app.kubernetes.io/part-of: raava-centaur
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args:
            - tunnel
            - --protocol
            - http2
            - --config
            - /etc/cloudflared/config.yml
            - run
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config.yml
              subPath: config.yml
              readOnly: true
            - name: credentials
              mountPath: /etc/cloudflared/credentials.json
              subPath: credentials.json
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: centaur-cloudflared-config
        - name: credentials
          secret:
            secretName: centaur-cloudflared-credentials
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-cloudflared-egress
  namespace: centaur
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: centaur-cloudflared
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: slackbotv2
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/name: centaur
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: centaur-slackbotv2-from-cloudflared
  namespace: centaur
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: slackbotv2
      app.kubernetes.io/instance: centaur
      app.kubernetes.io/name: centaur
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: centaur-cloudflared
      ports:
        - protocol: TCP
          port: 3001
