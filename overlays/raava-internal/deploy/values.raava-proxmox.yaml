# Raava production values — Centaur Rust control plane on the Proxmox k3s VM
# (centaur-k3s / VM 110, Proxmox node pve-03).
#
# Base: upstream paradigmxyz/centaur main (chart 0.1.139) + the Raava overlay
# carried in this repo (overlays/raava-internal). Layers on top of the chart
# defaults:
#
#   helm upgrade --install centaur contrib/chart -n centaur \
#     -f contrib/chart/values.yaml \
#     -f overlays/raava-internal/deploy/values.raava-proxmox.yaml \
#     --set-file overlay.systemPrompt=overlays/raava-internal/services/sandbox/SYSTEM_PROMPT.md
#
# Images are side-loaded into k3s containerd with pinned tags (registry "" =
# bare names). See deploy/RELEASE.md for the release flow. The pre-Rust keys
# (`api:`, `slackbot:`, `tokenBroker:`, `overlay.image`) do not exist on this
# chart and must not be reintroduced.

x-release: &release
  registry: "" # empty = bare names, i.e. side-loaded k3s containerd images
  tag: "0.1.139-48930633"
  pullPolicy: IfNotPresent

# --- Secret backend: 1Password Connect (writable token on Engineering) ----------
# The broker-credential OAuth refresh loop needs write scope on the vault.
ironProxy:
  secretSource: onepassword-connect
  secretTtl: 10m
  # Upstream allowlist so per-sandbox iron-proxy pods may dial pve-03's
  # tailnet address (Proxmox API) on the upstream ports. Requires the chart
  # support from PR raava-solutions/centaur#5 (fix/iron-proxy-upstream-allow-cidrs);
  # until that merges into this branch the key is inert.
  # 100.101.29.91 is asus-trx50's tailnet address, dialed by iron-proxy when a
  # sandbox Codex falls back to the zap provider (GLM, see codex.fallback).
  upstreamAllowCidrs:
    - 100.96.27.92/32
    - 100.101.29.91/32
  image:
    repository: centaur-iron-proxy
    <<: *release

# Stands up the in-cluster Connect API+sync pods. Gated on BOTH this flag and
# ironProxy.secretSource == "onepassword-connect". The credentials Secret
# already exists on the cluster (centaur-onepassword-connect-credentials).
onepasswordConnect:
  connect:
    create: true
    credentialsName: centaur-onepassword-connect-credentials
    credentialsKey: 1password-credentials.json
    serviceType: ClusterIP

secretManager:
  existingSecretName: centaur-infra-env
  envPrefix: ""

# Repo-cache clones sources for the overlay delivery below. The Raava fork is
# private, so the cache needs a GitHub token: a fine-grained, read-only PAT on
# raava-solutions/centaur stored as GITHUB_TOKEN in centaur-infra-env.
repoCache:
  githubToken:
    existingSecretName: centaur-infra-env
    secretKey: GITHUB_TOKEN

# --- Overlay delivery ------------------------------------------------------------
# Source 1: the base repo (tools, workflows, skills). Source 2: the Raava
# overlay — personas, tools, skills, workflows. Later sources shadow earlier
# ones on directory-name collision, so Raava wins over base.
overlays:
  sources:
    # Base repo tools/workflows/skills. Pinned to a real upstream commit —
    # the previous pin (93c43ed8…) never existed upstream and repo-cache's
    # fetch failed with GitHub 422. Matches live repo-cache REPOSITORY_REFS.
    - repo: paradigmxyz/centaur
      ref: "abe1d95e8289d362364a31677b01623611927144"
      visibility: public
    # Raava overlay pinned to fork main post-#4 (rbe CLI entrypoint fix,
    # d4411288). Drives both repo-cache REPOSITORY_REFS and api-rs
    # KUBERNETES_TOOLS_EXTRA_SOURCES.
    - repo: raava-solutions/centaur
      ref: "d44112880b227f7a059b9489ce44b0adcc3399a2"
      toolsSubdir: overlays/raava-internal/tools
      skillsSubdir: overlays/raava-internal/.agents/skills
      workflowsSubdir: overlays/raava-internal/workflows

# Raava sandbox system prompt, rendered into a ConfigMap for api-rs. Populate
# with --set-file so this file never drifts from the source.
overlay:
  mountPath: /app/overlay/org
  systemPrompt: ""

# --- Control plane --------------------------------------------------------------
apiRs:
  enabled: true
  image:
    repository: centaur-api-rs
    <<: *release
    # api-rs runs the wave-2 build (PR #14 empty-input_lines 400 rejection +
    # PR #15 pi runtime support, carries migration 0055). Repin to a
    # release tag once a full 0.1.141 image set is side-loaded.
    tag: "0.1.141-90a244bb"
  runMigrations: true
  syncInfraSecrets: true
  # 1Password vault the registered tool-secret sources resolve op:// refs from
  # (api-rs renders OP_VAULT; the binary default "ai-agents" does not exist in
  # the Raava account). The RBE token and the other tool credentials live in
  # Engineering — e.g. the RBE tool secret resolves
  # op://Engineering/RBE_API_TOKEN/credential.
  opVault: Engineering
  # Sized for the 8 GiB / 2 vCPU VM shared with console + postgres. Raise the
  # warm pool only after observing steady-state memory with console running.
  sandboxWarmPoolSize: 1
  extraEnv:
    CENTAUR_DEFAULT_PERSONA: chief
    # Extra sandbox passthrough names on top of the 32 the chart renders
    # from apiRs.etl.* (the chart appends these to SESSION_SANDBOX_PASSTHROUGH_ENV).
    # These keys hold credentials the in-sandbox infra tools need; values come
    # from the out-of-band centaur-infra-env Secret (not Helm-managed).
    SESSION_SANDBOX_PASSTHROUGH_ENV: "CENTAUR_GITHUB_APP_ID,CENTAUR_GITHUB_APP_PEM,CENTAUR_TAILSCALE_CLIENT_ID,CENTAUR_TAILSCALE_CLIENT_SECRET,CENTAUR_TAILSCALE_AUDIT_CLIENT_ID,CENTAUR_TAILSCALE_AUDIT_CLIENT_SECRET,RBE_API_TOKEN,CENTAUR_PROXMOX_TOKEN_SECRET,CENTAUR_PROXMOX_BASE_URL"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1536Mi

slackbotv2:
  enabled: true
  image:
    repository: centaur-slackbotv2
    <<: *release
  userName: centaur
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

# --- Codex usage-limit fallback --------------------------------------------------
# When OpenAI rejects a Codex turn for usage-limit/quota exhaustion, the
# sandbox harness re-resumes the thread on the zap provider (self-hosted
# GLM-5.3-Flash behind the ds4 gateway on asus-trx50, fronted by
# `tailscale serve` so the base URL is plain HTTPS on 443) and re-submits the
# turn. The gateway key must exist as ZAP_API_KEY in the 1Password Connect
# vault (see "Out-of-band live state" below); iron-proxy injects it only for
# the zap host, sandboxes hold a same-name placeholder.
codex:
  customProviders:
    zap:
      name: zap
      baseUrl: https://asus-trx50.tailf55d56.ts.net/v1
      apiKeyEnv: ZAP_API_KEY
      defaultModel: glm-5-3-flash
  fallback:
    provider: zap
    model: glm-5-3-flash

# --- Sandboxes ------------------------------------------------------------------
sandbox:
  controller: pod # api-rs creates plain pods; the standalone agent-sandbox
  # controller in agent-sandbox-system stays installed but unused.
  image:
    repository: centaur-agent
    <<: *release
    # Sandboxes run the wave-2 build (PR #15: pi harness-server subcommand +
    # pi CLI in the image). Repin to the release tag once a full 0.1.141
    # image set is side-loaded.
    tag: "0.1.141-90a244bb"
  # codex | amp | claudecode | pi. Must agree with the agent image's default CMD
  # and with the iron-proxy auth fragment api-rs registers. Flip to `pi` only
  # together with a sandbox image build that ships the pi harness-server
  # subcommand (see docs/pages/extend/pi-harness.mdx).
  #
  # 2026-10-04: pi flip deployed on the 0.1.141-90a244bb image. First attempt
  # used the zap GLM gateway, but asus-trx50 went offline fleet-wide, so pi
  # defaults to OpenRouter instead (public egress, no tailnet dependency).
  harnessEngine: pi
  codexAuthMode: access_token
  extraEnv:
    # Pi (the default engine) talks to OpenRouter. The iron-proxy
    # openrouter.ai fragment is registered by api-rs unconditionally
    # (harness_auth_fragment("openrouter","api_key")), so no chart or proxy
    # change is needed: the sandbox holds only the OPENROUTER_API_KEY
    # placeholder and iron-proxy swaps the real key from
    # op://Engineering/OPENROUTER_API_KEY/credential on the wire. Model is the
    # OpenRouter slug; change anytime via PI_DEFAULT_MODEL.
    # NOTE: there is no ANTHROPIC_API_KEY/OPENAI_API_KEY item in the
    # Engineering vault, so pi's anthropic/openai default providers cannot
    # authenticate — keep this override.
    PI_DEFAULT_PROVIDER: openrouter
    PI_DEFAULT_MODEL: anthropic/claude-sonnet-4.5
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# --- Console (iron-control) ------------------------------------------------------
# Required chart component on the Rust stack. Runs with a FRESH
# iron_control_production database created by its init container; api-rs
# (syncInfraSecrets=true) upserts the infra role and tool secrets at startup.
# The Codex OAuth broker credential must be re-seeded post-cutover — see the
# rust-cutover runbook.
console:
  image:
    repository: centaur-console
    tag: "0.1.139-48930633"
    pullPolicy: IfNotPresent

# --- State ----------------------------------------------------------------------
postgres:
  image:
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: local-path # must match the live PVC so the claim is reused
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# --- Cluster fit ----------------------------------------------------------------
# The agent-sandbox controller is installed standalone (Phase A, namespace
# agent-sandbox-system, cluster-scoped); keep the chart copy off to avoid a
# duplicate controller and a CRD-ownership conflict.
agentSandbox:
  enabled: false

# --- Out-of-band live state (NOT Helm-managed — do not automate) -----------------
# These cluster/host changes exist outside this release and must survive helm
# upgrades:
#
# 1. CoreDNS NodeHosts (k3s-managed, kube-system/coredns ConfigMap):
#      100.96.27.92 pve-03
#      100.96.27.92 pve-03.tailf55d56.ts.net
#    Lets in-cluster pods (iron-proxy) resolve the Proxmox API host over the
#    tailnet. Re-apply with `kubectl edit configmap -n kube-system coredns`
#    if a k3s upgrade regenerates the Corefile.
#
# 2. pve-03 runs `tailscale serve --bg https+insecure://localhost:8006`
#    because iron-proxy rejects pveproxy's self-signed certificate; the serve
#    listener fronts the Proxmox API with a tailnet cert. Sandboxes reach it
#    via CENTAUR_PROXMOX_BASE_URL=https://pve-03.tailf55d56.ts.net/api2/json,
#    which lives in the out-of-band centaur-infra-env Secret (see
#    SESSION_SANDBOX_PASSTHROUGH_ENV above). If pve-03 reboots, confirm the
#    serve config survived (`tailscale serve status` on pve-03).
#
# 3. CoreDNS NodeHosts (kube-system/coredns ConfigMap, same mechanism as #1):
#      100.101.29.91 asus-trx50
#      100.101.29.91 asus-trx50.tailf55d56.ts.net
#    Lets per-sandbox iron-proxy pods resolve the zap fallback provider host.
#    asus-trx50 already fronts its GLM gateway with `tailscale serve`
#    (/v1 -> localhost:4000) with a tailnet cert, so no serve change is needed
#    there.
#
# 4. ZAP_API_KEY in the 1Password Connect vault (item named ZAP_API_KEY,
#    credential field): the ds4 gateway bearer key, sourced from
#    asus-trx50:~zay/.config/modelctl/gateway-api-key (mode 0600, do not copy
#    into this repo or cluster Secrets). Until this item exists, fallback turns
#    fail with the gateway's 401 and surface as ordinary turn errors.
