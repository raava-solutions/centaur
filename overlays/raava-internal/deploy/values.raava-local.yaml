# Raava-owned local/dogfood values for the Centaur base chart.
#
# Keep this file in the overlay. Do not push Raava-specific deployment
# configuration back to the upstream `paradigmxyz/centaur` chart defaults.

overlay:
  image:
    repository: raava-centaur-overlay
    tag: local
    pullPolicy: IfNotPresent
    sourcePath: /overlay

api:
  firewallProxy:
    enabled: false
  executionWorkerEnabled: true
  pluginWatcherEnabled: true
  extraEnv:
    # Override per deployment with real Slack channel IDs.
    RAAVA_CENTAUR_CHANNEL_DEFAULTS: "{}"
    # Local Kind reaches hosted gbrain through a Cloud Run proxy sidecar in the
    # API pod. Direct-hosted deployments can override this to the Cloud Run URL
    # when RAAVA_GBRAIN_OAUTH is available to iron-proxy.
    RAAVA_GBRAIN_BASE_URL: "http://127.0.0.1:8087"
    WEBSEARCH_SYNTHESIS_PROVIDER: "auto"
    OPENROUTER_MODEL: "deepseek/deepseek-chat"
    # Local-only admin key for Kind smoke tests. Replace or remove outside dev.
    LOCAL_DEV_API_KEY: "aiv2_raava_local_dev_admin_key"
    # Docker Desktop and local clusters can take longer to create sandboxes.
    KUBERNETES_SANDBOX_READY_TIMEOUT_S: "180"

slackbot:
  enabled: true
  firewallProxy:
    enabled: false
  extraEnv:
    # Local Kind overlay does not deploy the API sandbox egress proxy service.
    # Leave Slack Web API traffic on direct HTTPS egress.
    # Optional: Slack channel ID for duplicate/runtime alerts.
    RUNTIME_ERROR_ALERT_CHANNEL: ""

ironProxy:
  secretSource: environment
  manager:
    secretSource: environment

tokenBroker:
  enabled: false

sandbox:
  codexAuth:
    existingSecretName: centaur-codex-auth
    secretKey: auth.json
  extraEnv:
    RAAVA_CENTAUR_PRODUCT: "internal-slack"
