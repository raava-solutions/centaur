kind: NetworkPolicy
metadata:
  name: centaur-centaur-api-rs
  labels:

    helm.sh/chart: centaur-0.1.55
    app.kubernetes.io/name: centaur
    app.kubernetes.io/instance: centaur
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api-rs
spec:
  podSelector:
    matchLabels:

      app.kubernetes.io/name: centaur
      app.kubernetes.io/instance: centaur
      app.kubernetes.io/component: api-rs
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:

              app.kubernetes.io/name: centaur
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/component: slackbotv2
        # Sandboxes call back into the control plane. agent-k8s labels its pods
        # centaur.ai/managed-by=api-rs (MANAGED_BY_VALUE in centaur-sandbox-agent-k8s),
        # which also covers the per-sandbox iron-proxy pods.
        - podSelector:
            matchLabels:
              centaur.ai/managed-by: api-rs
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:

              app.kubernetes.io/name: centaur
              app.kubernetes.io/instance: centaur
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Per-sandbox iron-proxy listeners (HTTP proxy + postgres port).
    - to:
        - podSelector:
            matchLabels:
              centaur.ai/iron-proxy: "true"
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
    # Kubernetes API egress. The kubernetes.default ClusterIP (:443) is DNAT'd
    # to the real endpoint port (6443 on k3s/kubeadm); enforcing CNIs match
    # egress post-DNAT, so allow that port or api-rs can't manage sandboxes.
    - ports:
        - protocol: TCP
          port: 6443
