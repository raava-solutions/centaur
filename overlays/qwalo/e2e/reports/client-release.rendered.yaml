spec:
  replicas: 1
  selector:
    matchLabels:

      app.kubernetes.io/name: centaur
      app.kubernetes.io/instance: centaur
      app.kubernetes.io/component: api-rs
  template:
    metadata:
      annotations:
        checksum/infra-secrets: 6fda96f0fbab93edd6fcbf94b6457ba295054b51685fd0db3272d0d703cec3a5
        checksum/overlay: fd673bd5fcf40adae3af13852d9a1e4c939f62266cd1ba09542f7166aaf01bd8

        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
      labels:

        app.kubernetes.io/name: centaur
        app.kubernetes.io/instance: centaur
        app.kubernetes.io/component: api-rs
    spec:
      terminationGracePeriodSeconds: 35
      automountServiceAccountToken: true
      serviceAccountName: centaur-centaur-api-rs
      containers:
        - name: api-rs
          image: "centaur-api-rs:2026.10.20-d441128"
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: centaur-infra-env
                  key: DATABASE_URL
            - name: BIND_ADDR
              value: "0.0.0.0:8080"
            - name: RUN_MIGRATIONS
              value: "true"
            - name: RUST_LOG
              value: info
            - name: TOOL_DIRS
              value: "/var/lib/centaur/repos/raava-solutions/centaur/overlays/qwalo/tools"
            - name: WORKFLOW_DIRS
              value: "/var/lib/centaur/repos/raava-solutions/centaur/workflows"
            - name: CENTAUR_OVERLAY_DIR
              value: "/app/overlay/org"
            - name: SESSION_SANDBOX_BACKEND
              value: "agent-k8s"
            - name: SESSION_SANDBOX_WORKLOAD
              value: "codex-app-server"
            - name: SESSION_SANDBOX_READY_TIMEOUT_SECS
              value: "90"
            - name: SESSION_SANDBOX_WARM_POOL_SIZE
              value: "1"
            - name: SESSION_SANDBOX_WARM_POOL_REPLENISH_INTERVAL_SECS
              value: "5"
            - name: SESSION_SANDBOX_IDLE_STOP_TTL_SECS
              value: "10800"
            - name: SESSION_SANDBOX_MAX_LIFETIME_SECS
              value: "259200"
            - name: SESSION_SANDBOX_REAP_INTERVAL_SECS
              value: "300"
            - name: SESSION_SANDBOX_K8S_NAMESPACE
              value: "default"
            - name: SESSION_SANDBOX_IMAGE
              value: "centaur-agent:2026.10.20-d441128"
            - name: SESSION_SANDBOX_IMAGE_PULL_POLICY
              value: "IfNotPresent"
            # Sandboxes call back into this control plane via the in-cluster Service.
            - name: SESSION_SANDBOX_CENTAUR_API_URL
              value: "http://centaur-centaur-api-rs:8080"
            - name: REPOS_PATH
              value: "/var/lib/centaur/repos"
            - name: KUBERNETES_SANDBOX_IRON_PROXY_MODE
              value: "enabled"
            - name: KUBERNETES_IRON_PROXY_IMAGE
              value: "centaur-iron-proxy:latest"
            - name: KUBERNETES_IRON_PROXY_IMAGE_PULL_POLICY
              value: "Always"
            - name: KUBERNETES_FIREWALL_CA_SECRET_NAME
              value: "centaur-firewall-ca"
            - name: KUBERNETES_FIREWALL_CA_KEY_SECRET_NAME
              value: "centaur-firewall-ca-key"
            - name: KUBERNETES_SECRET_ENV_NAME
              value: "centaur-infra-env"
            # Lets the per-sandbox iron-proxy NetworkPolicies target this control
            # plane's pods (callback + postgres-listener access).
            - name: KUBERNETES_API_POD_LABEL_SELECTOR
              value: "app.kubernetes.io/name=centaur,app.kubernetes.io/instance=centaur,app.kubernetes.io/component=api-rs"
            - name: FIREWALL_MANAGER_SECRET_SOURCE
              value: "onepassword"
            - name: FIREWALL_MANAGER_SECRET_TTL
              value: "10m"
            # Harness auth modes: single source of truth (sandbox.*AuthMode).
            # api-rs reads these to register the matching iron-proxy credential
            # and propagates them into each sandbox so the agent's auth.json
            # and the injected credential agree.
            - name: CODEX_AUTH_MODE
              value: "api_key"
            - name: CLAUDE_CODE_AUTH_MODE
              value: "api_key"
            # Which harness's auth fragment iron-proxy registers (and therefore
            # which placeholder credential lands in the sandbox env). Must agree
            # with the harness the sandbox image CMD actually runs.
            - name: KUBERNETES_IRON_PROXY_HARNESS_ENGINE
              value: "codex"
            # Operator sandbox env (sandbox.extraEnv), applied to every codex
            # sandbox api-rs creates. Carries the harness OTLP trace wiring
            # (endpoint, service name, NO_PROXY extras) that codex needs to
            # export usage/cost spans. Same contract as the Python control
            # plane's KUBERNETES_SANDBOX_EXTRA_ENV.
            - name: SESSION_SANDBOX_EXTRA_ENV
              value: "[{\"name\":\"QWALO_ACCOUNT_SCOPE\",\"value\":\"ere\"},{\"name\":\"QWALO_CONSOLE_URL\",\"value\":\"https://qwalo.raava.dev\"},{\"name\":\"QWALO_ENGINE_URL\",\"value\":\"https://qwalo.raava.dev\"}]"
            # Base tools are copied from repo-cache into each sandbox at boot by
            # a tools-bootstrap init container, so adding a tool is a push to the
            # repo, not an api-rs image rebuild. api-rs reads the same repo-cache
            # mount for tool-secret discovery and refreshes grants in-process.
            - name: KUBERNETES_TOOLS_REPO
              value: "raava-solutions/centaur"
            - name: KUBERNETES_TOOLS_REF
              value: "d441128e"
            - name: KUBERNETES_TOOLS_SUBDIR
              value: "overlays/qwalo/tools"
            - name: KUBERNETES_TOOLS_REPO_CACHE_PATH
              value: "/var/lib/centaur/repos"
            - name: KUBERNETES_TOOLS_RUNNER_IMAGE
              value: "centaur-agent:2026.10.20-d441128"
            - name: KUBERNETES_TOOLS_RUNNER_IMAGE_PULL_POLICY
              value: "IfNotPresent"
            - name: WORKFLOW_DIRS
              value: "/var/lib/centaur/repos/raava-solutions/centaur/overlays/qwalo/workflows"
          envFrom:
            - secretRef:
                name: centaur-infra-env
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:

            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          resources:

            limits:
              memory: 1024Mi
            requests:
              cpu: 100m
              memory: 384Mi
          volumeMounts:
            - name: repo-cache
              mountPath: "/var/lib/centaur/repos"
              readOnly: true
      volumes:
        - name: repo-cache
          hostPath:
            path: "/var/lib/centaur/repos"
            type: DirectoryOrCreate
