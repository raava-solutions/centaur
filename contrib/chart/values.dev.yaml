secretManager:
  backend: onepassword
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  auth:
    existingSecretName: centaur-infra-env
    existingSecretKey: POSTGRES_PASSWORD

slackbot:
  enabled: true
  image:
    pullPolicy: IfNotPresent

api:
  image:
    pullPolicy: IfNotPresent
  executionWorkerEnabled: true
  pluginWatcherEnabled: true
  egressDiscovery:
    enabled: false
  # Local k3s sandboxes can be slow to reach Ready; give them more headroom
  # than the upstream default so smoke/E2E turns don't time out on cold nodes.
  extraEnv:
    KUBERNETES_SANDBOX_READY_TIMEOUT_S: "180"

ironProxy:
  image:
    pullPolicy: IfNotPresent
  manager:
    secretSource: onepassword

tokenBroker:
  enabled: true

sandbox:
  image:
    pullPolicy: IfNotPresent
