[project]
name = "approval"
description = "Durable operator approvals: request approval for an action and wait for the signed Slack button decision"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
approval = "centaur_tool_approval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_approval"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


# No iron-proxy secret: api-rs is plain HTTP in-cluster, and the proxy rejects
# plain-HTTP forwards, so the approval API is reached directly with the raw
# CENTAUR_APPROVAL_API_KEY passed into the sandbox env (api-rs accepts it as
# the approval-only `approval-agent` caller).
[tool.centaur]
module = "client.py"
