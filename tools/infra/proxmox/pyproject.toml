[project]
name = "proxmox"
description = "Proxmox VE — cluster/node status, VM/CT inventory, and guest power control (no create/delete/config)"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
proxmox = "centaur_tool_proxmox.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_proxmox"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
hosts = ["pve-03", "pve-03.*"]
secrets = [
    {type = "http", name = "CENTAUR_PROXMOX_TOKEN_SECRET", match_headers = ["Authorization"], hosts = ["pve-03", "pve-03.*"]},
]
